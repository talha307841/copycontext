<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=400, initial-scale=1.0">
  <title>ContextShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="cs-popup">

    <!-- ── Header ── -->
    <header id="cs-header">
      <div class="cs-header-left">
        <span class="cs-logo-icon">⎌</span>
        <span class="cs-logo-text">ContextShift</span>
      </div>
      <div class="cs-header-right">
        <span id="cs-api-badge" class="cs-badge cs-badge--offline" title="API status">● Offline</span>
        <button id="cs-settings" class="cs-icon-btn" title="Settings" aria-label="Open Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Platform indicator ── -->
    <div id="cs-platform-row">
      <span id="cs-platform-badge" class="cs-platform-badge"></span>
    </div>

    <!-- ── Capture ── -->
    <section id="cs-capture-section">
      <button id="cs-capture-btn" class="cs-btn cs-btn--primary" disabled>
        <svg class="cs-btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Capture Conversation
      </button>
      <p class="cs-privacy">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        100% local — your data never leaves this device
      </p>
    </section>

    <!-- ── Generate (shown after capture) ── -->
    <section id="cs-generate-section" style="display:none">
      <button id="cs-generate-btn" class="cs-btn cs-btn--secondary">
        <svg class="cs-btn-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Generate Smart Summary
      </button>
    </section>

    <!-- ── Preview card (shown after generate) ── -->
    <section id="cs-preview-section" style="display:none">
      <div class="cs-card">
        <div class="cs-card-label">Context Preview</div>
        <textarea id="cs-preview" readonly spellcheck="false"></textarea>
      </div>
    </section>

    <!-- ── Transfer actions ── -->
    <section id="cs-transfer-section" style="display:none">
      <div class="cs-action-row">
        <button id="cs-copy-btn" class="cs-btn cs-btn--outline">
          <svg class="cs-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <div class="cs-inject-combo">
          <select id="cs-inject-platform" class="cs-select" aria-label="Target platform">
            <option value="chatgpt">ChatGPT</option>
            <option value="claude">Claude</option>
            <option value="gemini">Gemini</option>
            <option value="perplexity">Perplexity</option>
            <option value="grok">Grok</option>
          </select>
          <button id="cs-inject-btn" class="cs-btn cs-btn--accent">
            Auto-Inject
            <svg class="cs-btn-icon cs-btn-icon--right" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ── History accordion ── -->
    <section id="cs-history-section">
      <button id="cs-history-header" class="cs-history-toggle" aria-expanded="false">
        <span>Recent Contexts</span>
        <span id="cs-history-chevron" class="cs-chevron">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <ul id="cs-history-list" style="display:none" role="list"></ul>
      <p id="cs-history-empty" style="display:none" class="cs-history-empty">No captures yet. Capture your first conversation above.</p>
    </section>

    <!-- ── Status footer ── -->
    <footer id="cs-status-bar"></footer>

  </div>
  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
